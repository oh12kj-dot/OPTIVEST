[project]
name = "optivest"
version = "0.1.0"
description = "Research-only OptiVest Phase 1 control plane"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.18,<2",
  "fastapi>=0.115,<1",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
